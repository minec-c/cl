    .cll{
      background:#121212;
      color:#dcdcdc;
      border:none;
      outline:none;
      padding:4px;
      font-size:13px;
      box-sizing:border-box;
    }
    .cll.type-void{color:rgb(90,90,90);}
    .cll.type-num{color:rgb(90,255,90);}
    .cll.type-text{color:rgb(220,220,220);}
    .cll.type-expr{color:rgb(90,200,255);}
    .cll.type-err{color:rgb(255,90,90);}
    .cll:focus{background:#1e1e1e;
               box-shadow:inset 0 0 0 2px yellow;

function cellCoords(el) {
    return {
        row: parseInt(el.id.slice(1), 10) - 1,
        col: el.id.charCodeAt(0) - 65
    };
}
document.getElementById('mobileSpreadsheet').addEventListener('focusin',function(e){
    var el = e.target;
    if (!el.classList.contains('cll')) return;
    var p = cellCoords(el);
    Module.ccall('mobile_select_cell',null,['number','number'],[p.row,p.col]);
    Module.ccall('mobile_begin_edit',null,['number','number'],[p.row,p.col]);
//    el.value = Module.ccall('mobile_get_cell_display','string',['number','number'],[p.row,p.col]);
      el.value = Module.ccall('mobile_get_cell_edit_text', 'string',['number', 'number'], [p.row, p.col]);
    el.setSelectionRange(el.value.length, el.value.length);
});

function copyCell(el){
  const p = cellCoords(el);
  Module.ccall(
    'mobile_copy_cell',
    null,
    ['number','number'],
    [p.row,p.col]
  );
}

function pasteCell(el){
  const p = cellCoords(el);
  const text = Module.ccall(
    'mobile_paste_cell',
    'string',
    ['number','number'],
    [p.row,p.col]
  );
  el.value = text;
}

function pasteSpreadsheetText(text){
	Module.ccall(
	'ps_tb',
	'void',
	['string'],
	[text]);
}

    if (!el || !el.classList.contains('cll')) return;
    copyCell(el);

document.addEventListener('paste', function(event) {
    var el = document.activeElement;
    if (!el || !el.classList.contains('cll')) return;
    event.preventDefault();
    var text = event.clipboardData.getData('text/plain');
    var p = cellCoords(el);
    // Make sure C starts pasting at the focused cell.
    Module.ccall(
        'mobile_select_cell',
        null,
        ['number', 'number'],
        [p.row, p.col]
    );
    // Paste the complete tab-separated table into C.
    Module.ccall(
        'ps_tb',
        null,
        ['string'],
        [text]
    );
    // Refresh every visible HTML cell from C.
    var inputs = document.querySelectorAll('.cll');
    var classes = [
        'type-void', 'type-num', 'type-text',
        'type-expr', 'type-err'
    ];
    for (var i = 0; i < inputs.length; i++) {
        var cell = inputs[i];
        var pos = cellCoords(cell);
        var value = Module.ccall(
            'mobile_get_cell_display',
            'string',
            ['number', 'number'],
            [pos.row, pos.col]
        );
        var type = Module.ccall(
            'mobile_get_cell_type',
            'number',
            ['number', 'number'],
            [pos.row, pos.col]
        );
        cell.value = value;
        cell.classList.remove(
            'type-void', 'type-num', 'type-text',
            'type-expr', 'type-err'
        );
        cell.classList.add(classes[type] || 'type-err');
    }
    // Keep the original starting cell focused.
    el.focus();
});
